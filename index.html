<style>
  :root{
    --bg:#08080b;
    --fg:#ffffff;
    --muted:#b9b5c4;
    --border:rgba(255,255,255,.12);
    --brand:linear-gradient(135deg,#ff9a1f 0%,#ff5a1f 45%,#e11d2f 100%);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
    background:var(--bg);color:var(--fg);
    display:flex;align-items:center;justify-content:center;
    padding:40px 20px;position:relative;overflow-x:hidden;
  }
  .bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;opacity:.7;z-index:-2}
  .overlay{position:fixed;inset:0;z-index:-1;
    background:radial-gradient(circle at 50% 30%,rgba(225,29,47,.28),transparent 60%),
               linear-gradient(180deg,rgba(8,8,11,.75),rgba(8,8,11,.95));}
  .card{
    width:100%;max-width:430px;text-align:center;
    border:1px solid var(--border);border-radius:28px;
    background:rgba(18,18,22,.65);backdrop-filter:blur(18px);
    padding:48px 28px;box-shadow:0 30px 80px rgba(0,0,0,.6);
  }
  .logo-ring{
    width:160px;height:160px;margin:0 auto;border-radius:50%;padding:3px;
    background:var(--brand);box-shadow:0 0 40px rgba(255,90,31,.55);
  }
  .logo-ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
  h1{margin-top:32px;font-size:38px;font-weight:800;letter-spacing:-.5px}
  p.desc{margin:20px auto 0;max-width:300px;font-size:17px;line-height:1.6;color:var(--muted)}
  .btn{
    display:block;margin-top:40px;padding:17px 24px;border-radius:18px;
    background:var(--brand);color:#fff;text-decoration:none;
    font-size:18px;font-weight:800;letter-spacing:1px;
    box-shadow:0 0 40px rgba(255,90,31,.5);transition:transform .15s ease;
  }
  .btn:hover{transform:scale(1.02)}
  .btn:active{transform:scale(.99)}
  .copy{margin-top:40px;font-size:13px;letter-spacing:3px;color:rgba(185,181,196,.7)}
</style>

<body>
  <img class="bg" src="stadium-bg.jpg" alt="" aria-hidden="true" />
  <div class="overlay"></div>

  <main class="card">
    <div class="logo-ring">
      <img src="jp-logo.jpg" alt="https://ibb.co/PGwNDYtt" />
    </div>
    <h1>JAADUGAR BHAI</h1>

    <a class="btn" href="https://t.me/+p5xhWU-0JK1kNGM1" target="_blank" rel="noopener noreferrer">JOIN TELEGRAM NOW</a>
    <p class="copy">© 2026 JAADUGAR BHAI</p>
  </main>
</body>
